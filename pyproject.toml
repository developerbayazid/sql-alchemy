[project]
name = "sql-alchemy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "developerbayazid", email = "bayazid.freelancer@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.5.5",
    "psycopg2-binary>=2.9.12",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
sql-alchemy = "sql_alchemy:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
